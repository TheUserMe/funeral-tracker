<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Funeral Appreciation Platform</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3004/3004022.png">

  <!-- Tailwind & Supabase -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-16 selection:bg-amber-500/30">

  <!-- ROLE & EVENT SELECTOR OVERLAY -->
  <div id="role-selector" class="fixed inset-0 bg-slate-900 z-50 flex-col items-center justify-center hidden">
    <h2 class="text-2xl md:text-3xl font-bold text-amber-400 mb-2">Funeral Tracker</h2>
    <p class="text-slate-400 mb-8 text-sm">Configure this device</p>
    
    <div class="flex flex-col gap-4 w-full max-w-xs px-4">
      
      <!-- Event ID Input -->
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg mb-2">
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Event ID (e.g., mensah)</label>
        <input type="text" id="event-id-input" placeholder="Enter event name" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-amber-400 text-sm transition" />
      </div>

      <button onclick="setRole('admin')" class="w-full py-4 bg-slate-800 border border-amber-500 rounded-xl text-white font-bold hover:bg-slate-700 shadow-lg flex flex-col items-center transition">
        <span>Admin Desk</span>
        <span class="text-xs font-normal text-slate-400 mt-1">Requires PIN Code</span>
      </button>
      
      <button onclick="setRole('mc')" class="w-full py-4 bg-slate-800 border border-emerald-500 rounded-xl text-white font-bold hover:bg-slate-700 shadow-lg flex flex-col items-center transition">
        <span>MC Stream</span>
        <span class="text-xs font-normal text-slate-400 mt-1">Live read-only broadcast</span>
      </button>
    </div>
  </div>

  <!-- DATABASE CONNECTION & SETUP -->
  <script>
    const SUPABASE_URL = "https://chxgbrilnauucbfjgdzc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoeGdicmlsbmF1dWNiZmpnZHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDE2MzQsImV4cCI6MjEwNDE3NzYzNH0.s9dfEpT9meUQIuxrqPNKwsvAHaohkvgzc_dwHCZgVLI";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Multi-Tenancy Event ID Setup
    const urlParams = new URLSearchParams(window.location.search);
    let currentEvent = localStorage.getItem('funeralEventId') || urlParams.get('event') || 'demo-event';

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('PWA Error:', err));
    }
  </script>

  <!-- TOP BAR -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-xl md:text-2xl font-bold tracking-tight text-amber-400">Funeral Tracker</h1>
          <button onclick="resetRole()" class="text-[10px] bg-slate-700 px-2 py-1 rounded text-slate-300 hover:text-white transition">Switch</button>
        </div>
        <p class="text-xs md:text-sm text-slate-400">
          <span id="network-status">🟢 Online</span> 
          <span class="text-slate-600 mx-1">|</span> 
          <span class="text-slate-500 uppercase text-[10px]" id="display-event-id">ID: </span>
        </p>
      </div>

      <div class="flex items-center gap-4 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700 shadow-inner">
        <div>
          <span class="block text-[10px] uppercase text-slate-400 font-semibold">Total Cash</span>
          <span id="total-amount" class="text-base md:text-lg font-extrabold text-emerald-400">0.00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- ADMIN DESK -->
    <section id="admin-view" class="lg:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit shadow-lg hidden">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
        <h2 class="text-lg font-bold text-slate-200">Admin Entry Desk</h2>
        <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono">Record</span>
      </div>

      <form id="donation-form" class="space-y-4">
        <input type="text" id="donor_name" required placeholder="Giver's Name / Group" class="w-full px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400 text-sm shadow-inner transition" />
        <input type="text" id="recipient" required placeholder="Given For / Honor Of" class="w-full px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400 text-sm shadow-inner transition" />
        
        <!-- Toggle: Cash vs Item -->
        <div>
          <select id="donation_type" onchange="toggleInputType()" class="w-full px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400 text-sm shadow-inner transition mb-1">
            <option value="cash">💰 Cash Contribution</option>
            <option value="item">🎁 Physical Item / Object</option>
          </select>
        </div>

        <!-- Inputs that swap based on toggle -->
        <input type="number" step="any" id="amount" required placeholder="Amount (e.g. 500)" class="w-full px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-emerald-400 text-sm shadow-inner transition" />
        <input type="text" id="item_desc" placeholder="e.g. 5 Crates of Malt" class="w-full px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400 text-sm shadow-inner transition hidden" />

        <label class="flex items-center gap-2 text-sm text-slate-300 mt-2 cursor-pointer">
          <input type="checkbox" id="is-anonymous" class="rounded accent-amber-500 w-4 h-4" />
          Make Anonymous
        </label>

        <!-- Manual Sync Failsafe Button -->
        <button type="button" id="manual-sync-btn" onclick="syncOfflineData()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg hidden shadow-md mt-4 transition">
          ⬆️ Sync Offline (<span id="queue-count">0</span>)
        </button>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold rounded-lg transition duration-150 shadow-md mt-4 flex items-center justify-center gap-2">
          Submit Appreciation
        </button>
      </form>
    </section>

    <!-- MC STREAM -->
    <section id="mc-view" class="lg:col-span-7 hidden">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <span class="w-3 h-3 bg-red-500 rounded-full animate-ping inline-block"></span> MC Stream
          </h2>
          <p class="text-xs text-slate-400">Updates instantly via database</p>
        </div>
        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 shadow-sm">
          <input type="checkbox" id="hide-announced" class="rounded accent-amber-500 w-4 h-4" /> Hide Announced
        </label>
      </div>

      <div id="donations-stream" class="space-y-3">
        <p class="text-slate-500 text-center py-12">Waiting for live entries...</p>
      </div>
    </section>
  </main>

  <!-- APPLICATION LOGIC -->
  <script>
    const ADMIN_PIN = "7788"; 
    let donations = [];
    let offlineQueue = JSON.parse(localStorage.getItem('donationQueue')) || [];
    let userRole = localStorage.getItem('funeralUserRole');
    let isAdmin = false;
    let realtimeSubscription = null;

    // --- 1. ROLE MANAGEMENT & UI TOGGLES ---
    function initRole() {
      const roleSelector = document.getElementById('role-selector');
      const adminSection = document.getElementById('admin-view');
      const mcSection = document.getElementById('mc-view');

      if (!userRole || !localStorage.getItem('funeralEventId')) {
        roleSelector.style.display = 'flex';
        adminSection.style.display = 'none';
        mcSection.style.display = 'none';
        
        if (urlParams.get('event')) {
          document.getElementById('event-id-input').value = urlParams.get('event');
        }
      } else {
        roleSelector.style.display = 'none';
        applyRoleViews();
      }
    }

    function setRole(role) {
      const inputtedEvent = document.getElementById('event-id-input').value.trim().toLowerCase();
      if (!inputtedEvent) {
        alert("⚠️ Please enter an Event ID before continuing.");
        return;
      }

      if (role === 'admin') {
        const enteredPin = prompt("Enter Admin Passcode to access the Entry Desk:");
        if (enteredPin !== ADMIN_PIN) {
          alert("❌ Incorrect Passcode. Access Denied.");
          return;
        }
      }

      currentEvent = inputtedEvent;
      localStorage.setItem('funeralEventId', currentEvent);
      
      userRole = role;
      localStorage.setItem('funeralUserRole', role);
      
      initRole();
      setupDatabaseListeners();
      loadDonations();
    }

    function resetRole() {
      if(confirm("Switch roles or change Event ID? You will be logged out.")) {
        localStorage.removeItem('funeralUserRole');
        localStorage.removeItem('funeralEventId');
        userRole = null;
        currentEvent = null;
        if(realtimeSubscription) {
          supabaseClient.removeChannel(realtimeSubscription);
        }
        initRole();
      }
    }

    function applyRoleViews() {
      const adminSection = document.getElementById('admin-view');
      const mcSection = document.getElementById('mc-view');
      isAdmin = (userRole === 'admin');

      document.getElementById("display-event-id").innerText = `ID: ${currentEvent}`;

      if (isAdmin) {
        adminSection.style.display = 'block';
        mcSection.style.display = 'block';
        mcSection.classList.replace('lg:col-span-12', 'lg:col-span-7');
      } else {
        adminSection.style.display = 'none';
        mcSection.style.display = 'block';
        mcSection.classList.replace('lg:col-span-7', 'lg:col-span-12');
      }
      renderDonations();
    }

    function toggleInputType() {
      const type = document.getElementById("donation_type").value;
      const amountInput = document.getElementById("amount");
      const itemInput = document.getElementById("item_desc");

      if (type === 'cash') {
        amountInput.classList.remove("hidden");
        amountInput.required = true;
        itemInput.classList.add("hidden");
        itemInput.required = false;
        itemInput.value = ""; 
      } else {
        amountInput.classList.add("hidden");
        amountInput.required = false;
        amountInput.value = ""; 
        itemInput.classList.remove("hidden");
        itemInput.required = true;
      }
    }

    // --- 2. UI RENDERING ---
    function formatMoney(amount) {
      return Number(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function renderDonations() {
      const stream = document.getElementById("donations-stream");
      const hideAnnounced = document.getElementById("hide-announced").checked;
      
      let filtered = hideAnnounced ? donations.filter(d => !d.is_announced) : donations;

      if (filtered.length === 0) {
        stream.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-800/40 rounded-xl border border-slate-800">No items pending.</div>`;
        return;
      }

      stream.innerHTML = filtered.map(d => `
        <div class="p-4 rounded-xl border transition-all duration-300 shadow-md ${d.is_announced ? 'bg-slate-900/60 border-slate-800 opacity-50' : 'bg-slate-800 border-amber-500/40'}">
          <div class="flex items-start justify-between gap-4">
            <div>
              <span class="text-[10px] text-amber-400 uppercase tracking-wider font-semibold block mb-1">Giver</span>
              <h3 class="text-lg md:text-xl font-bold text-white leading-tight">${d.donor_name}</h3>
              <p class="text-sm text-slate-300 mt-1"><span class="text-slate-500">For:</span> <span class="font-medium text-slate-200">${d.recipient}</span></p>
            </div>
            <div class="text-right flex flex-col items-end">
              
              ${d.item_description 
                ? `<span class="text-lg md:text-xl font-bold text-amber-300 flex items-center gap-2">🎁 ${d.item_description}</span>` 
                : `<span class="text-xl md:text-2xl font-black text-emerald-400">${formatMoney(d.amount)}</span>`
              }
              
              <div class="flex gap-2 mt-2">
                ${isAdmin ? `<button onclick="deleteDonation(${d.id})" class="text-xs px-2 py-1 rounded border border-red-500/50 text-red-400 hover:bg-red-500/10 transition">Delete</button>` : ''}
                <button onclick="toggleAnnounced(${d.id}, ${d.is_announced})" class="text-xs px-3 py-1 rounded border font-semibold transition ${d.is_announced ? 'bg-slate-800 text-slate-400 border-slate-700' : 'bg-amber-500 text-slate-950 border-amber-400 hover:bg-amber-400'}">
                  ${d.is_announced ? 'Announced' : 'Mark'}
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');

      document.getElementById("total-amount").innerText = formatMoney(donations.reduce((acc, curr) => acc + Number(curr.amount || 0), 0));
    }

        // --- 3. DATABASE OPERATIONS (Upgraded for Offline) ---
    async function loadDonations() {
      if (!currentEvent) return;
      const { data } = await supabaseClient
        .from('donations')
        .select('*')
        .eq('event_id', currentEvent)
        .order('id', { ascending: false });
        
      if (data) { 
        donations = data; 
        renderDonations(); 
      }
    }

    async function toggleAnnounced(id, currentStatus) {
      const newStatus = !currentStatus;

      if (navigator.onLine) {
        await supabaseClient.from('donations').update({ is_announced: newStatus }).eq('id', id);
      } else {
        // Offline: Log the update action
        offlineQueue.push({ action: 'UPDATE', id: id, payload: { is_announced: newStatus } });
        localStorage.setItem('donationQueue', JSON.stringify(offlineQueue));
        
        // Optimistically update the screen so the Admin can keep working
        donations = donations.map(d => d.id === id ? { ...d, is_announced: newStatus } : d);
        renderDonations();
        updateOfflineUI();
      }
    }

    async function deleteDonation(id) {
      if(!confirm("Delete this record permanently? This cannot be undone.")) return;

      if (navigator.onLine) {
        await supabaseClient.from('donations').delete().eq('id', id);
      } else {
        // Offline: Log the delete action
        offlineQueue.push({ action: 'DELETE', id: id });
        localStorage.setItem('donationQueue', JSON.stringify(offlineQueue));
        
        // Optimistically remove it from the screen
        donations = donations.filter(d => d.id !== id);
        renderDonations();
        updateOfflineUI();
      }
    }

    // --- 4. FORM SUBMISSION & ADVANCED OFFLINE QUEUE ---
    function updateOfflineUI() {
      const syncBtn = document.getElementById("manual-sync-btn");
      const countSpan = document.getElementById("queue-count");
      if (syncBtn && countSpan) {
        if (offlineQueue.length > 0) {
          syncBtn.classList.remove("hidden");
          countSpan.innerText = offlineQueue.length;
        } else {
          syncBtn.classList.add("hidden");
        }
      }
    }

    async function syncOfflineData() {
      if (offlineQueue.length === 0) return;
      
      const submitBtn = document.getElementById("submit-btn");
      const syncBtn = document.getElementById("manual-sync-btn");
      
      submitBtn.disabled = true;
      if (syncBtn) syncBtn.innerText = "Syncing Actions...";

      let successCount = 0;
      let failedQueue = [];

      // Process the action log in the exact order the Admin performed them
      for (let item of offlineQueue) {
        let error = null;

        if (item.action === 'INSERT') {
          const res = await supabaseClient.from('donations').insert([item.record]);
          error = res.error;
        } else if (item.action === 'UPDATE') {
          const res = await supabaseClient.from('donations').update(item.payload).eq('id', item.id);
          error = res.error;
        } else if (item.action === 'DELETE') {
          const res = await supabaseClient.from('donations').delete().eq('id', item.id);
          error = res.error;
        }

        if (error) {
          failedQueue.push(item);
        } else {
          successCount++;
        }
      }

      offlineQueue = failedQueue;
      localStorage.setItem('donationQueue', JSON.stringify(offlineQueue));
      updateOfflineUI();

      submitBtn.disabled = false;
      if (syncBtn) syncBtn.innerHTML = `⬆️ Sync Offline (<span id="queue-count">${offlineQueue.length}</span>)`;

      if (offlineQueue.length === 0) {
        alert(`✅ Success! ${successCount} offline actions pushed to the MC.`);
      } else {
        alert(`⚠️ Synced ${successCount}, but ${failedQueue.length} failed. Keep app open to retry.`);
      }

      loadDonations();
    }

    document.getElementById("donation-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      btn.disabled = true; 
      btn.innerText = "Processing...";

      const isAnon = document.getElementById("is-anonymous").checked;
      const donor_name = isAnon ? "Anonymous Well-Wisher" : document.getElementById("donor_name").value.trim();
      const isCash = document.getElementById("donation_type").value === 'cash';
      
      const record = { 
        event_id: currentEvent,
        donor_name, 
        recipient: document.getElementById("recipient").value.trim(), 
        amount: isCash ? parseFloat(document.getElementById("amount").value) : null,
        item_description: isCash ? null : document.getElementById("item_desc").value.trim() 
      };

      if (navigator.onLine) {
        const { error } = await supabaseClient.from('donations').insert([record]);
        if (error) {
          // Changed to the new INSERT action format
          offlineQueue.push({ action: 'INSERT', record: record });
          localStorage.setItem('donationQueue', JSON.stringify(offlineQueue));
          updateOfflineUI();
        }
      } else {
        // Changed to the new INSERT action format
        offlineQueue.push({ action: 'INSERT', record: record });
        localStorage.setItem('donationQueue', JSON.stringify(offlineQueue));
        updateOfflineUI();
        alert("⚠️ No Network: Saved to Offline Queue.");
      }
      
      document.getElementById("donation-form").reset();
      document.getElementById("donation_type").value = "cash";
      toggleInputType();
      
      document.getElementById("donor_name").focus();
      btn.disabled = false; 
      btn.innerText = "Submit Appreciation";
    });


    // --- 5. NETWORK STATUS LISTENERS ---
    window.addEventListener('online', () => {
      document.getElementById('network-status').innerText = "🟢 Online";
      document.getElementById('network-status').classList.remove('text-red-400');
      if (offlineQueue.length > 0) syncOfflineData();
    });

    window.addEventListener('offline', () => {
      document.getElementById('network-status').innerText = "🔴 Offline Mode";
      document.getElementById('network-status').classList.add('text-red-400');
    });

            // --- 6. REAL-TIME SUPABASE LISTENER ---
    function setupDatabaseListeners() {
      if (realtimeSubscription) {
        supabaseClient.removeChannel(realtimeSubscription);
      }
      if (!currentEvent) return;
      
      realtimeSubscription = supabaseClient.channel(`public:donations:${currentEvent}`)
        .on('postgres_changes', { 
          event: '*', 
          schema: 'public', 
          table: 'donations',
          filter: `event_id=eq.${currentEvent}`
        }, (payload) => {
          if (payload.eventType === 'INSERT') {
            if (!donations.find(d => d.id === payload.new.id)) {
              donations.unshift(payload.new);
            }
          } else if (payload.eventType === 'UPDATE') {
            donations = donations.map(d => d.id === payload.new.id ? payload.new : d);
          } else if (payload.eventType === 'DELETE') {
            // FIX: Supabase delete payloads pass the ID in payload.old.id
            const deletedId = payload.old.id;
            donations = donations.filter(d => Number(d.id) !== Number(deletedId));
          }
          renderDonations();
        }).subscribe();
    }



    // --- 7. BOOTSTRAP ---
    document.getElementById("hide-announced").addEventListener("change", renderDonations);
    
    initRole();
    if (userRole && currentEvent) {
      setupDatabaseListeners();
      loadDonations();
    }
    updateOfflineUI();

  </script>
</body>
</html>
