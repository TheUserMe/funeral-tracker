
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funeral Appreciation & Donations Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-16">

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoeGdicmlsbmF1dWNiZmpnZHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDE2MzQsImV4cCI6MjEwNDE3NzYzNH0.s9dfEpT9meUQIuxrqPNKwsvAHaohkvgzc_dwHCZgVLI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-tight text-amber-400">Funeral Appreciation Tracker</h1>
        <p class="text-xs md:text-sm text-slate-400">Live feed & collection desk</p>
      </div>

      <div class="flex items-center gap-6 bg-slate-900/80 px-4 py-2 rounded-lg border border-slate-700">
        <div>
          <span class="block text-xs uppercase text-slate-400 font-semibold">Total Raised</span>
          <span id="total-amount" class="text-lg md:text-xl font-extrabold text-emerald-400">0.00</span>
        </div>
        <div class="border-l border-slate-700 pl-4">
          <span class="block text-xs uppercase text-slate-400 font-semibold">Givers</span>
          <span id="total-count" class="text-lg md:text-xl font-extrabold text-amber-300">0</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <section class="lg:col-span-5 bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit shadow-lg">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700 pb-3">
        <h2 class="text-lg font-bold text-slate-200">Admin Entry Desk</h2>
        <span class="text-xs bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono">Record</span>
      </div>

      <form id="donation-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Giver's Name / Group</label>
          <input 
            type="text" 
            id="donor_name" 
            required 
            placeholder="e.g. Mr. & Mrs. Mensah / Old Boys '98"
            class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Given For / In Honor Of</label>
          <input 
            type="text" 
            id="recipient" 
            required 
            placeholder="e.g. Children, Bereaved Family, Late Mother"
            class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Amount Given</label>
          <input 
            type="number" 
            step="any"
            id="amount" 
            required 
            placeholder="e.g. 500"
            class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 text-sm"
          />
        </div>

        <button 
          type="submit" 
          id="submit-btn"
          class="w-full py-3 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold rounded-lg transition duration-150 shadow-md mt-2 flex items-center justify-center gap-2">
          Submit Appreciation
        </button>
      </form>
    </section>

    <section class="lg:col-span-7">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold text-white flex items-center gap-2">
            <span class="w-3 h-3 bg-red-500 rounded-full animate-ping inline-block"></span>
            MC Live Announcement Stream
          </h2>
          <p class="text-xs text-slate-400">Updates instantly as records are entered</p>
        </div>

        <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <input type="checkbox" id="hide-announced" class="rounded accent-amber-500" />
          Hide Announced
        </label>
      </div>

      <div id="donations-stream" class="space-y-3">
        <p class="text-slate-500 text-center py-12">Waiting for live entries...</p>
      </div>
    </section>
  </main>

  <script>
    let donations = [];

    // Format currency
    function formatMoney(amount) {
      return Number(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Render list
    function renderDonations() {
      const stream = document.getElementById("donations-stream");
      const hideAnnounced = document.getElementById("hide-announced").checked;
      
      const filtered = hideAnnounced 
        ? donations.filter(d => !d.is_announced)
        : donations;

      if (filtered.length === 0) {
        stream.innerHTML = `<div class="p-8 text-center text-slate-500 bg-slate-800/40 rounded-xl border border-slate-800">No pending items to display.</div>`;
        return;
      }

      stream.innerHTML = filtered.map(d => `
        <div class="p-4 rounded-xl border transition-all duration-300 ${d.is_announced ? 'bg-slate-900/60 border-slate-800 opacity-50' : 'bg-slate-800 border-amber-500/40 shadow-lg'}">
          <div class="flex items-start justify-between gap-4">
            <div>
              <span class="text-xs text-amber-400 uppercase tracking-wider font-semibold">Giver</span>
              <h3 class="text-lg md:text-xl font-bold text-white">${d.donor_name}</h3>
              <p class="text-sm text-slate-300 mt-1"><span class="text-slate-500">For:</span> <span class="font-medium text-slate-200">${d.recipient}</span></p>
            </div>
            
            <div class="text-right flex flex-col items-end">
              <span class="text-xl md:text-2xl font-black text-emerald-400">${formatMoney(d.amount)}</span>
              <button 
                onclick="toggleAnnounced(${d.id}, ${d.is_announced})" 
                class="mt-2 text-xs px-3 py-1 rounded-md border font-semibold transition ${d.is_announced ? 'bg-slate-800 text-slate-400 border-slate-700' : 'bg-amber-500 text-slate-950 border-amber-400 hover:bg-amber-400'}">
                ${d.is_announced ? '✓ Announced' : 'Mark Announced'}
              </button>
            </div>
          </div>
        </div>
      `).join('');

      // Update Summary Counter
      const totalSum = donations.reduce((acc, curr) => acc + Number(curr.amount), 0);
      document.getElementById("total-amount").innerText = formatMoney(totalSum);
      document.getElementById("total-count").innerText = donations.length;
    }

    // Fetch Initial Records
    async function loadDonations() {
      const { data, error } = await supabase
        .from('donations')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("Error loading donations:", error);
      } else {
        donations = data || [];
        renderDonations();
      }
    }

    // Toggle Announced Status
    async function toggleAnnounced(id, currentStatus) {
      const { error } = await supabase
        .from('donations')
        .update({ is_announced: !currentStatus })
        .eq('id', id);

      if (error) console.error("Error updating status:", error);
    }

    // Form Submission
    document.getElementById("donation-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.innerText = "Saving...";

      const donor_name = document.getElementById("donor_name").value.trim();
      const recipient = document.getElementById("recipient").value.trim();
      const amount = parseFloat(document.getElementById("amount").value);

      const { error } = await supabase
        .from('donations')
        .insert([{ donor_name, recipient, amount }]);

      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Appreciation";

      if (error) {
        alert("Failed to submit: " + error.message);
      } else {
        document.getElementById("donation-form").reset();
        document.getElementById("donor_name").focus();
      }
    });

    // Real-Time Listener (Supabase WebSockets)
    supabase
      .channel('realtime:donations')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'donations' }, (payload) => {
        if (payload.eventType === 'INSERT') {
          donations.unshift(payload.new);
        } else if (payload.eventType === 'UPDATE') {
          donations = donations.map(d => d.id === payload.new.id ? payload.new : d);
        } else if (payload.eventType === 'DELETE') {
          donations = donations.filter(d => d.id === payload.old.id);
        }
        renderDonations();
      })
      .subscribe();

    // Filter checkbox trigger
    document.getElementById("hide-announced").addEventListener("change", renderDonations);

    // Initial load
    loadDonations();

       // VIEW SEPARATION LOGIC
    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view');
    
    if (view === 'mc') {
      // Hide the admin form
      document.querySelector('.lg\\:col-span-5').style.display = 'none';
      document.querySelector('.lg\\:col-span-7').classList.remove('lg:col-span-7');
    } else if (view === 'admin') {
      // Hide the live stream
      document.querySelector('.lg\\:col-span-7').style.display = 'none';
      document.querySelector('.lg\\:col-span-5').classList.remove('lg:col-span-5');
    }

  </script>
</body>
</html>
