<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Admin | Funeral Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans selection:bg-blue-500/30">

  <!-- AUTHENTICATION VIEW -->
  <div id="auth-view" class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-2xl w-full max-w-sm">
      <h1 class="text-2xl font-bold text-white mb-2">Platform Admin</h1>
      <p class="text-sm text-slate-400 mb-6">Sign in to manage client events.</p>
      
      <form id="login-form" class="space-y-4">
        <input type="email" id="email" required placeholder="Admin Email" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 text-sm transition" />
        <input type="password" id="password" required placeholder="Password" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 text-sm transition" />
        <button type="submit" id="login-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition shadow-md">
          Secure Login
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboard-view" class="hidden min-h-screen flex flex-col">
    <!-- Top Nav -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-blue-400">Super Admin Dashboard</h1>
      <button onclick="logout()" class="text-sm text-slate-400 hover:text-white transition">Sign Out</button>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- Left Column: Create Event -->
      <section class="md:col-span-1">
        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg sticky top-6">
          <h2 class="text-lg font-bold text-white mb-4 border-b border-slate-800 pb-2">Generate New Event</h2>
          <form id="create-event-form" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Client / Family Name</label>
              <input type="text" id="client_name" required placeholder="e.g., The Mensah Family" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 text-sm transition" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Event Slug (App ID)</label>
              <input type="text" id="event_slug" required placeholder="e.g., mensah-accra" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 text-sm transition lowercase" />
            </div>
            <button type="submit" id="create-btn" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition shadow-md mt-2">
              + Provision Event
            </button>
          </form>
        </div>
      </section>

      <!-- Right Column: Active Events List -->
      <section class="md:col-span-2">
        <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden">
          <div class="p-6 border-b border-slate-800 flex justify-between items-center">
            <h2 class="text-lg font-bold text-white">Active Client Deployments</h2>
            <button onclick="loadEvents()" class="text-xs bg-slate-800 px-3 py-1 rounded text-slate-300 hover:text-white border border-slate-700 transition">Refresh List</button>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-950/50 text-slate-400 text-xs uppercase tracking-wider">
                  <th class="px-6 py-4 font-semibold">Client</th>
                  <th class="px-6 py-4 font-semibold">Slug (ID)</th>
                  <th class="px-6 py-4 font-semibold text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="events-table-body" class="divide-y divide-slate-800 text-sm">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Supabase Initialization
    const SUPABASE_URL = "https://chxgbrilnauucbfjgdzc.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE"; // Keep the same key used in your app
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');

    // --- 1. AUTHENTICATION ---
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        authView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
        loadEvents();
      } else {
        authView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.innerText = "Authenticating...";
      
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      });

      if (error) {
        alert("Login failed: " + error.message);
        btn.innerText = "Secure Login";
      } else {
        checkSession();
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      checkSession();
    }

    // --- 2. EVENT MANAGEMENT ---
    document.getElementById('create-event-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('create-btn');
      btn.innerText = "Provisioning...";

      const eventData = {
        client_name: document.getElementById('client_name').value.trim(),
        event_slug: document.getElementById('event_slug').value.trim().toLowerCase().replace(/\s+/g, '-')
      };

      const { error } = await supabaseClient.from('events').insert([eventData]);

      if (error) {
        alert("Failed to create event: " + error.message);
      } else {
        document.getElementById('create-event-form').reset();
        loadEvents();
      }
      btn.innerText = "+ Provision Event";
    });

    async function loadEvents() {
      const tbody = document.getElementById('events-table-body');
      tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-slate-500">Loading deployments...</td></tr>';

      const { data, error } = await supabaseClient
        .from('events')
        .select('*')
        .order('created_at', { ascending: false });

      if (error || !data) return tbody.innerHTML = '<tr><td colspan="3" class="text-center text-red-500">Error loading data.</td></tr>';
      
      if (data.length === 0) return tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-8 text-center text-slate-500">No active events.</td></tr>';

      tbody.innerHTML = data.map(event => `
        <tr class="hover:bg-slate-800/50 transition">
          <td class="px-6 py-4 font-medium text-slate-200">${event.client_name}</td>
          <td class="px-6 py-4"><span class="bg-slate-950 px-2 py-1 rounded text-blue-400 font-mono text-xs border border-slate-700">${event.event_slug}</span></td>
          <td class="px-6 py-4 text-right space-x-2">
            <a href="index.html?event=${event.event_slug}" target="_blank" class="text-xs px-3 py-1.5 rounded border border-slate-600 text-slate-300 hover:bg-slate-700 transition">Launch App</a>
            <button onclick="exportCSV('${event.event_slug}', '${event.client_name}')" class="text-xs px-3 py-1.5 rounded border border-emerald-600/50 text-emerald-400 hover:bg-emerald-600/20 transition">↓ CSV Ledger</button>
          </td>
        </tr>
      `).join('');
    }

    // --- 3. CSV ACCOUNTING EXPORT ---
    async function exportCSV(eventSlug, clientName) {
      // Fetch all donations for this specific event
      const { data, error } = await supabaseClient
        .from('donations')
        .select('*')
        .eq('event_id', eventSlug)
        .order('created_at', { ascending: true });

      if (error) return alert("Export failed: " + error.message);
      if (!data || data.length === 0) return alert("No records found for this event.");

      // Format CSV Headers
      const headers = ['Timestamp', 'Giver', 'Recipient', 'Amount (Cash)', 'Physical Item', 'Announced Status'];
      const csvRows = [headers.join(',')];

      // Map database rows to CSV rows safely escaping commas and quotes
      data.forEach(row => {
        const date = new Date(row.created_at).toLocaleString();
        const giver = `"${(row.donor_name || '').replace(/"/g, '""')}"`;
        const recipient = `"${(row.recipient || '').replace(/"/g, '""')}"`;
        const amount = row.amount || 0;
        const item = `"${(row.item_description || '').replace(/"/g, '""')}"`;
        const announced = row.is_announced ? 'Yes' : 'No';
        
        csvRows.push([date, giver, recipient, amount, item, announced].join(','));
      });

      // Generate File Download
      const csvString = csvRows.join('\n');
      const blob = new Blob([csvString], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.setAttribute('href', url);
      a.setAttribute('download', `${clientName.replace(/\s+/g, '_')}_Financial_Ledger.csv`);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Init
    checkSession();
  </script>
</body>
</html>
